[project]
name = "old-mission-draft-model"
version = "0.1.0"
description = "Point-in-time fantasy football draft rankings for Old Mission vol '26"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "polars>=1.30,<2",
  "pyarrow>=18,<22",
  "scikit-learn>=1.6,<2",
]

[project.scripts]
fantasy-backtest = "fantasy_model.backtest:main"
fantasy-draft = "fantasy_model.draft_day:main"
fantasy-kalshi = "fantasy_model.kalshi:main"
fantasy-kalshi-backtest = "fantasy_model.kalshi_backtest:main"
fantasy-market = "fantasy_model.market:main"
fantasy-rookies = "fantasy_model.rookies:main"
fantasy-sync-mfl = "fantasy_model.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_model"]

[tool.pytest.ini_options]
testpaths = ["tests/model"]
addopts = "-q"
